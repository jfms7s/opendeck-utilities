[package]
name = "opendeck-utilities"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "OpenDeck plugin: customizable audio, device brightness and profile switching controls"
repository = "https://github.com/jfms7s/opendeck-utilities"

[dependencies]
openaction = "2.7"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "6"
async-trait = "0.1"
thiserror = "2"
log = "0.4"
simplelog = "0.12"
base64 = "0.22"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# CoreAudio (HAL) bindings for the macOS audio backend; pure Rust.
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
# Typed CFString ownership and reading for the HAL's device names and UIDs.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["test-util", "macros", "rt"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
