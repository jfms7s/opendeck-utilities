<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="pi.css" />
	<style>
		#gestures { display: flex; flex-direction: column; gap: 10px; }
		.checks { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow: auto; }
	</style>
</head>
<body>
	<main class="pi">
		<section class="card">
			<h2>Target</h2>
			<div class="field">
				<label for="target">Control</label>
				<select id="target">
					<option value="default_output">Default output (follows system)</option>
					<option value="default_input">Default input / mic (follows system)</option>
					<option value="output">Specific output device</option>
					<option value="input">Specific input device</option>
					<option value="app">Application</option>
				</select>
			</div>
			<div id="target_name_row" class="field hidden">
				<label for="target_name" id="target_name_label">Device</label>
				<input id="target_name" list="target_names" />
				<datalist id="target_names"></datalist>
			</div>
			<div class="row">
				<div class="field">
					<label for="step">Volume step (%)</label>
					<input id="step" type="number" />
				</div>
				<div class="field">
					<label for="max_volume">Maximum volume</label>
					<select id="max_volume">
						<option value="100">100%</option>
						<option value="125">125%</option>
						<option value="150">150%</option>
					</select>
				</div>
			</div>
		</section>

		<section class="card">
			<h2>Gestures</h2>
			<div class="field encoder-only">
				<label for="rotate">Rotate</label>
				<select id="rotate">
					<option value="volume">Change volume</option>
					<option value="cycle_device">Switch device</option>
					<option value="none">Nothing</option>
				</select>
			</div>
			<div id="gestures"></div>
		</section>

		<section class="card" role="group" aria-label="Devices to switch between">
			<h2>Devices to switch between</h2>
			<p class="hint">None ticked = all.</p>
			<div class="checks" id="cycle_devices"></div>
		</section>

		<section class="card">
			<h2>Display</h2>
			<div class="field">
				<label for="label">Label</label>
				<input id="label" />
				<p class="hint">Blank = device or app name.</p>
			</div>
			<div class="field">
				<label for="accent">Accent colour</label>
				<input id="accent" type="color" />
			</div>
			<label class="check"><input id="show_percent" type="checkbox" /> Show percent</label>
		</section>
	</main>

	<datalist id="device_names"></datalist>

	<!-- Defaults and bounds; src/pi_pages.rs checks they match the plugin. -->
	<script type="application/json" id="defaults">
	{
		"settings": {
			"target": "default_output",
			"target_name": "",
			"step": 5,
			"max_volume": 100,
			"rotate": "volume",
			"cycle_devices": [],
			"label": "",
			"accent": "#4fc3f7",
			"show_percent": true
		},
		"bounds": { "step": [1, 20], "max_volume": [100, 150], "gesture_volume": [0, 150] },
		"gestures": {
			"Keypad": {
				"press": { "op": "toggle_mute", "volume": 50, "device": "" },
				"long_press": { "op": "none", "volume": 50, "device": "" },
				"touch_tap": { "op": "none", "volume": 50, "device": "" }
			},
			"Encoder": {
				"press": { "op": "toggle_mute", "volume": 50, "device": "" },
				"long_press": { "op": "cycle_device", "volume": 50, "device": "" },
				"touch_tap": { "op": "toggle_mute", "volume": 50, "device": "" }
			}
		},
		"ops": [
			["none", "Nothing"], ["toggle_mute", "Toggle mute"], ["volume_up", "Volume up"],
			["volume_down", "Volume down"], ["set_volume", "Set volume to…"], ["cycle_device", "Switch to next device"],
			["set_default_device", "Switch to device…"], ["push_to_talk", "Push to talk (hold)"]
		]
	}
	</script>
	<script src="pi.js"></script>
	<script>
		const DEFAULTS = PI.readJson("defaults");
		const SLOTS = [["press", "Press"], ["long_press", "Long press (hold ½ s)"], ["touch_tap", "Touch-strip tap"]];
		const byId = (id) => document.getElementById(id);

		let controller = "Keypad", settings = {}, choices = null;

		const pi = PI.connect({
			onOpen(payload) {
				controller = payload.controller || "Keypad";
				settings = payload.settings || {};
				pi.requestChoices();
				render();
			},
			onSettings(next) {
				settings = next;
				render();
			},
			onMessage(payload) {
				if (payload.event !== "audioChoices") return;
				choices = payload;
				controller = choices.controller || controller;
				markAppSupport();
				render();
			},
		});

		// macOS has no per-app audio: keep the option (a saved App control
		// still shows what it is) but disable it and say why.
		function markAppSupport() {
			const option = byId("target").querySelector('option[value="app"]');
			const supported = choices.appsSupported !== false;
			option.disabled = !supported;
			option.textContent = supported ? "Application" : "Application (not supported on macOS)";
		}

		function gestureValue(slot) {
			// The plugin's effective gestures win over this page's copy of the defaults.
			return settings[slot] ?? choices?.effective?.[slot] ?? DEFAULTS.gestures[controller === "Keypad" ? "Keypad" : "Encoder"][slot];
		}

		function field(slot, name) {
			return document.querySelector(`[data-slot="${slot}"][data-field="${name}"]`);
		}

		function buildGestures() {
			const root = byId("gestures");
			root.replaceChildren();
			const [minVolume, maxVolume] = DEFAULTS.bounds.gesture_volume;
			for (const [slot, title] of SLOTS) {
				if (slot === "touch_tap" && controller !== "Encoder") continue;
				const label = document.createElement("label");
				label.textContent = title;
				const select = document.createElement("select");
				select.dataset.slot = slot;
				select.dataset.field = "op";
				for (const [value, text] of DEFAULTS.ops) {
					if (value === "push_to_talk" && slot !== "press") continue;
					const option = document.createElement("option");
					option.value = value;
					option.textContent = text;
					select.appendChild(option);
				}
				const volume = document.createElement("input");
				Object.assign(volume, { type: "number", min: minVolume, max: maxVolume, placeholder: "Volume %" });
				volume.className = "narrow";
				volume.dataset.slot = slot;
				volume.dataset.field = "volume";
				const device = document.createElement("input");
				device.setAttribute("list", "device_names");
				device.placeholder = "Device";
				device.dataset.slot = slot;
				device.dataset.field = "device";
				for (const el of [select, volume, device]) el.addEventListener("change", onChange);
				const row = document.createElement("div");
				row.className = "row";
				row.append(select, volume, device);
				const wrapper = document.createElement("div");
				wrapper.className = "field";
				wrapper.append(label, row);
				root.appendChild(wrapper);
			}
		}

		function toggleGestureFields(slot) {
			const select = field(slot, "op");
			if (!select) return;
			field(slot, "volume").classList.toggle("hidden", select.value !== "set_volume");
			field(slot, "device").classList.toggle("hidden", select.value !== "set_default_device");
		}

		function isInputTarget() {
			return ["default_input", "input"].includes(byId("target").value);
		}

		function fillOptions(list, items) {
			list.replaceChildren();
			for (const [value, text] of items) {
				const option = document.createElement("option");
				option.value = value;
				option.label = text;
				list.appendChild(option);
			}
		}

		function updateTargetName() {
			const target = byId("target").value;
			byId("target_name_row").classList.toggle("hidden", !["output", "input", "app"].includes(target));
			byId("target_name_label").textContent = target === "app" ? "Application (process or app name)" : "Device";
			if (!choices) return;
			const devices = isInputTarget() ? choices.inputs : choices.outputs;
			const items = target === "app"
				? choices.apps.map((a) => [a.match, a.app_name])
				: ["output", "input"].includes(target) ? devices.map((d) => [d.name, d.description]) : [];
			fillOptions(byId("target_names"), items);
			// Apps can only be moved to outputs.
			const switchable = target === "app" ? choices.outputs : devices;
			fillOptions(byId("device_names"), switchable.map((d) => [d.name, d.description]));
		}

		function fillCycle() {
			const root = byId("cycle_devices");
			root.replaceChildren();
			if (!choices) return;
			const list = isInputTarget() ? choices.inputs : choices.outputs;
			const chosen = settings.cycle_devices || [];
			for (const d of list) {
				const label = document.createElement("label");
				label.className = "check";
				const box = document.createElement("input");
				box.type = "checkbox";
				box.value = d.name;
				box.checked = chosen.includes(d.name);
				box.addEventListener("change", onChange);
				label.append(box, document.createTextNode(d.description));
				root.appendChild(label);
			}
		}

		function render() {
			const d = DEFAULTS.settings;
			byId("target").value = settings.target || d.target;
			byId("target_name").value = settings.target_name || d.target_name;
			byId("step").value = settings.step ?? d.step;
			byId("max_volume").value = String(settings.max_volume ?? d.max_volume);
			byId("rotate").value = settings.rotate || d.rotate;
			byId("label").value = settings.label || d.label;
			byId("accent").value = /^#[0-9a-fA-F]{6}$/.test(settings.accent || "") ? settings.accent : d.accent;
			byId("show_percent").checked = settings.show_percent ?? d.show_percent;
			document.querySelectorAll(".encoder-only").forEach((el) => el.classList.toggle("hidden", controller !== "Encoder"));
			buildGestures();
			for (const [slot] of SLOTS) {
				const select = field(slot, "op");
				if (!select) continue;
				const g = gestureValue(slot);
				select.value = g.op;
				field(slot, "volume").value = g.volume ?? DEFAULTS.gestures.Keypad.press.volume;
				field(slot, "device").value = g.device || "";
				toggleGestureFields(slot);
			}
			updateTargetName();
			fillCycle();
		}

		function collect() {
			const d = DEFAULTS.settings;
			const boxes = Array.from(document.querySelectorAll("#cycle_devices input"));
			const next = {
				target: byId("target").value,
				target_name: byId("target_name").value.trim(),
				step: PI.clampInt(byId("step").value, DEFAULTS.bounds.step, d.step),
				max_volume: PI.clampInt(byId("max_volume").value, DEFAULTS.bounds.max_volume, d.max_volume),
				rotate: byId("rotate").value,
				label: byId("label").value,
				accent: byId("accent").value,
				show_percent: byId("show_percent").checked,
				cycle_devices: PI.mergeSubset(
					settings.cycle_devices,
					boxes.map((b) => b.value),
					boxes.filter((b) => b.checked).map((b) => b.value),
				),
			};
			for (const [slot] of SLOTS) {
				const select = field(slot, "op");
				if (!select) {
					// Not shown for this controller - keep whatever was stored.
					if (settings[slot]) next[slot] = settings[slot];
					continue;
				}
				next[slot] = {
					op: select.value,
					volume: PI.clampInt(field(slot, "volume").value, DEFAULTS.bounds.gesture_volume, DEFAULTS.gestures.Keypad.press.volume),
					device: field(slot, "device").value.trim(),
				};
			}
			return next;
		}

		function onChange() {
			settings = collect();
			for (const [slot] of SLOTS) toggleGestureFields(slot);
			updateTargetName();
			fillCycle();
			pi.save(settings);
		}

		const [minStep, maxStep] = DEFAULTS.bounds.step;
		Object.assign(byId("step"), { min: minStep, max: maxStep });
		for (const id of ["target", "target_name", "step", "max_volume", "rotate", "label", "accent", "show_percent"]) {
			byId(id).addEventListener("change", onChange);
		}
	</script>
</body>
</html>
