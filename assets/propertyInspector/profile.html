<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="pi.css" />
	<style>
		.checks { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow: auto; }
	</style>
</head>
<body>
	<main class="pi">
		<section class="card" id="key_only">
			<h2>Switch to</h2>
			<div class="field">
				<label for="profile">Profile</label>
				<select id="profile"></select>
			</div>
		</section>

		<section class="card">
			<h2>Device</h2>
			<div class="field">
				<label for="device">Device</label>
				<input id="device" list="devices" />
				<datalist id="devices"></datalist>
				<p class="hint">Blank = this one.</p>
			</div>
		</section>

		<section class="card" id="dial_only" role="group" aria-label="Profiles on the dial">
			<h2>Profiles on the dial</h2>
			<p class="hint">None ticked = all, in the order they were ticked.</p>
			<div class="checks" id="cycle"></div>
		</section>
	</main>

	<script src="pi.js"></script>
	<script>
		const byId = (id) => document.getElementById(id);
		let settings = {}, profiles = [];

		const pi = PI.connect({
			onOpen(payload) {
				const isKey = payload.controller === "Keypad";
				byId("key_only").classList.toggle("hidden", !isKey);
				byId("dial_only").classList.toggle("hidden", isKey);
				settings = payload.settings || {};
				pi.requestChoices();
				render();
			},
			onSettings(next) {
				settings = next;
				render();
			},
			onMessage(payload) {
				if (payload.event !== "profileChoices") return;
				profiles = payload.profiles || [];
				const list = byId("devices");
				list.replaceChildren();
				for (const id of payload.devices || []) {
					const option = document.createElement("option");
					option.value = id;
					list.appendChild(option);
				}
				render();
			},
		});

		function render() {
			byId("device").value = settings.device || "";
			const select = byId("profile");
			select.replaceChildren();
			const names = profiles.includes(settings.profile) || !settings.profile ? profiles : [settings.profile, ...profiles];
			for (const name of names) {
				const option = document.createElement("option");
				option.value = name;
				option.textContent = name;
				select.appendChild(option);
			}
			select.value = settings.profile || "";
			const root = byId("cycle");
			root.replaceChildren();
			const chosen = settings.cycle || [];
			for (const name of profiles) {
				const label = document.createElement("label");
				label.className = "check";
				const box = document.createElement("input");
				box.type = "checkbox";
				box.value = name;
				box.checked = chosen.includes(name);
				box.addEventListener("change", send);
				label.append(box, document.createTextNode(name));
				root.appendChild(label);
			}
		}

		function send() {
			const boxes = Array.from(document.querySelectorAll("#cycle input"));
			settings = {
				device: byId("device").value.trim(),
				profile: byId("profile").value,
				// Keeps the user's dial order, and profiles not listed right now.
				cycle: PI.mergeSubset(
					settings.cycle,
					boxes.map((b) => b.value),
					boxes.filter((b) => b.checked).map((b) => b.value),
				),
			};
			pi.save(settings);
		}
		byId("device").addEventListener("change", send);
		byId("profile").addEventListener("change", send);
	</script>
</body>
</html>
