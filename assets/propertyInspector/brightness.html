<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="stylesheet" href="pi.css" />
</head>
<body>
	<main class="pi">
		<section class="card" id="key_only">
			<h2>Action</h2>
			<div class="field">
				<label for="key_op">Key press</label>
				<select id="key_op">
					<option value="increase">Increase by step</option>
					<option value="decrease">Decrease by step</option>
					<option value="set">Set to value</option>
					<option value="toggle_presets">Toggle between presets</option>
				</select>
			</div>
			<div class="field">
				<label for="value">Value (%)</label>
				<input id="value" type="number" />
				<p class="hint">Used by "Set to value".</p>
			</div>
		</section>

		<section class="card">
			<h2>Presets</h2>
			<div class="row">
				<div class="field">
					<label for="preset_a">Preset A (%)</label>
					<input id="preset_a" type="number" />
				</div>
				<div class="field">
					<label for="preset_b">Preset B (%)</label>
					<input id="preset_b" type="number" />
				</div>
			</div>
			<p class="hint">Pressing the dial toggles between them.</p>
		</section>

		<section class="card">
			<h2>Step</h2>
			<div class="field">
				<label for="step">Step (%)</label>
				<input id="step" type="number" />
				<p class="hint">Rotating the dial steps the brightness by this much.</p>
			</div>
			<div class="status">Changes go through <code>opendeck --process-message</code> (OpenDeck 2.14.0 tested); if one doesn't take effect the control flashes an alert and the plugin log says why.</div>
		</section>
	</main>
	<!-- Defaults and bounds; src/pi_pages.rs checks they match the plugin. -->
	<script type="application/json" id="defaults">
	{
		"settings": { "key_op": "increase", "value": 50, "step": 5, "preset_a": 0, "preset_b": 50 },
		"bounds": { "value": [0, 100], "step": [1, 50], "preset_a": [0, 100], "preset_b": [0, 100] }
	}
	</script>
	<script src="pi.js"></script>
	<script>
		const DEFAULTS = PI.readJson("defaults");
		const NUMBERS = Object.keys(DEFAULTS.bounds);
		const byId = (id) => document.getElementById(id);

		const pi = PI.connect({
			onOpen(payload) {
				byId("key_only").classList.toggle("hidden", payload.controller !== "Keypad");
				apply(payload.settings || {});
			},
			onSettings: apply,
		});

		function apply(settings) {
			for (const [id, fallback] of Object.entries(DEFAULTS.settings)) byId(id).value = settings[id] ?? fallback;
		}

		function send() {
			const payload = { key_op: byId("key_op").value };
			for (const id of NUMBERS) {
				payload[id] = PI.clampInt(byId(id).value, DEFAULTS.bounds[id], DEFAULTS.settings[id]);
				// Show what was saved, not an out-of-range entry.
				byId(id).value = payload[id];
			}
			pi.save(payload);
		}

		for (const id of NUMBERS) {
			const [min, max] = DEFAULTS.bounds[id];
			Object.assign(byId(id), { min, max });
		}
		for (const id of Object.keys(DEFAULTS.settings)) byId(id).addEventListener("change", send);
	</script>
</body>
</html>
