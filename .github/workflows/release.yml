name: Release
# Pushing a v* tag builds the plugin (Linux binaries on Ubuntu, the macOS
# one on a macOS runner) and creates a *draft* release with the
# bundle, its SHA256SUMS and a build-provenance attestation attached
# (check a download with `gh attestation verify`). The draft's notes start with the
# README's smoke-test checklist, unticked, under an UNVERIFIED line
# (scripts/release-body.mjs). Run that checklist on Linux and a Mac, record it
# in the notes, then publish with scripts/publish-release.sh (see "Releasing").
# Publishing freezes it: immutable releases are meant to be on for this
# repository, so a published release's assets and tag can't be replaced - fix
# a bad release with a new version.
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-01)
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Tag matches Cargo.toml and manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[0].version')"
          manifest_version="$(jq -r .Version assets/manifest.json)"
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$manifest_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml ($cargo_version) and manifest.json ($manifest_version)"
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Property-inspector tests
        run: node --test tests/*.test.mjs
      # A known advisory in a dependency stops the release (CI's `audit`
      # job runs the same scan on every PR and weekly).
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories

  build-macos:
    # Native Apple Silicon build. Read-only, like `build-linux`. No build
    # cache in this workflow: a tag build starts clean, so nothing a PR run
    # left behind can reach a release.
    needs: check
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-01)
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Check it is a signed arm64 binary that starts
        run: scripts/check-macos-binary.sh target/aarch64-apple-darwin/release/opendeck-utilities
      - name: Pack the binary (a tar keeps the executable bit; artifacts don't)
        run: tar -cf macos-bin.tar -C target/aarch64-apple-darwin/release opendeck-utilities
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-bin
          path: macos-bin.tar
          if-no-files-found: error

  build-linux:
    # Runs alongside build-macos.
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-01)
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Pack the binary (a tar keeps the executable bit; artifacts don't)
        run: tar -cf linux-bin.tar -C target/x86_64-unknown-linux-gnu/release opendeck-utilities
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-bin
          path: linux-bin.tar
          if-no-files-found: error

  build:
    # Assembles the bundle from both builds; compiles nothing.
    needs: [build-linux, build-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-bin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-bin
      - name: Unpack the Linux binary where build.mjs looks for it
        run: |
          mkdir -p target/x86_64-unknown-linux-gnu/release
          tar -xf linux-bin.tar -C target/x86_64-unknown-linux-gnu/release
          bin=target/x86_64-unknown-linux-gnu/release/opendeck-utilities
          test -x "$bin"
          file -b "$bin" | grep -q 'ELF 64-bit LSB .*x86-64'
      - name: Unpack the macOS binary where build.mjs looks for it
        run: |
          mkdir -p target/aarch64-apple-darwin/release
          tar -xf macos-bin.tar -C target/aarch64-apple-darwin/release
          bin=target/aarch64-apple-darwin/release/opendeck-utilities
          test -x "$bin"
          # macOS's file says "executable arm64", Linux's "arm64 executable".
          file -b "$bin" | grep -Eq '^Mach-O 64-bit (arm64 executable|executable arm64)'
      - name: Assemble the bundle (Linux x86_64 and macOS arm64 binaries, one manifest)
        run: node build.mjs x86_64-unknown-linux-gnu aarch64-apple-darwin
      - name: Zip the bundle and checksum it
        run: |
          (cd dist && zip -r ../opendeck-utilities.streamDeckPlugin com.jfms7s.utilities.sdPlugin)
          unzip -Z opendeck-utilities.streamDeckPlugin | grep -E '^-rwx.*opendeck-utilities-aarch64-apple-darwin$'
          unzip -Z opendeck-utilities.streamDeckPlugin | grep -E '^-rwx.*opendeck-utilities-x86_64-unknown-linux-gnu$'
          sha256sum opendeck-utilities.streamDeckPlugin > SHA256SUMS
          cat SHA256SUMS
      # Written after the bundle is zipped and checksummed, so it is in
      # neither; it only becomes the draft's notes.
      - name: Write the draft's notes (the README smoke checklist, unticked)
        run: node scripts/release-body.mjs > RELEASE_BODY.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin
          path: |
            opendeck-utilities.streamDeckPlugin
            SHA256SUMS
            RELEASE_BODY.md
          if-no-files-found: error

  publish:
    # The only job with write access; it runs no project code.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin
      # Signed by GitHub, outside the release's assets: whoever could swap the
      # bundle could swap SHA256SUMS, but not this.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: opendeck-utilities.streamDeckPlugin
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            opendeck-utilities.streamDeckPlugin
            SHA256SUMS
          # GitHub puts the generated change list after this body.
          body_path: RELEASE_BODY.md
          generate_release_notes: true
