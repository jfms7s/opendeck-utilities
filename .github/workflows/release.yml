name: Release
# Pushing a v* tag builds the plugin and creates a *draft* release with the
# bundle and its SHA256SUMS attached. Publish the draft after running the
# README's smoke-test checklist on the build (see "Releasing").
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-01)
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Tag matches Cargo.toml and manifest.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[0].version')"
          manifest_version="$(jq -r .Version assets/manifest.json)"
          if [ "$tag" != "$cargo_version" ] || [ "$tag" != "$manifest_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml ($cargo_version) and manifest.json ($manifest_version)"
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Property-inspector tests
        run: node --test tests/*.test.mjs

  build:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-01)
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - name: Install cross-compilation linker (aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - run: cargo build --release --locked --target aarch64-unknown-linux-gnu
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Assemble the bundle (both architectures, one manifest)
        run: node build.mjs x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - name: Zip the bundle and checksum it
        run: |
          (cd dist && zip -r ../opendeck-utilities.streamDeckPlugin com.jfms7s.utilities.sdPlugin)
          sha256sum opendeck-utilities.streamDeckPlugin > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin
          path: |
            opendeck-utilities.streamDeckPlugin
            SHA256SUMS
          if-no-files-found: error

  publish:
    # The only job with write access; it runs no project code.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            opendeck-utilities.streamDeckPlugin
            SHA256SUMS
          body: |
            Verify the download with `sha256sum -c SHA256SUMS`.

            Draft: run the README smoke-test checklist on this build and note the
            OpenDeck, pactl and PipeWire versions here before publishing.
