name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-01)
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          targets: aarch64-apple-darwin
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # Type-checks the macOS code here too (no C dependencies, so no SDK
      # needed): a Linux-only change that breaks macOS fails fast.
      - run: cargo clippy --target aarch64-apple-darwin --all-targets --locked -- -D warnings
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Property-inspector tests
        run: node --test tests/*.test.mjs

  msrv:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-01)
        with:
          toolchain: "1.88" # Cargo.toml rust-version
      - run: cargo check --all-targets --locked

  # The release ships an Apple Silicon binary: lint, test and package it
  # natively, with the release's signature and start-up checks.
  macos:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-01)
        with:
          toolchain: 1.98.1
          components: clippy
          targets: aarch64-apple-darwin
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Property-inspector tests
        run: node --test tests/*.test.mjs
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - name: Check it is a signed arm64 binary that starts
        run: |
          bin=target/aarch64-apple-darwin/release/opendeck-utilities
          file "$bin"
          # macOS's file says "executable arm64", Linux's "arm64 executable".
          file -b "$bin" | grep -Eq '^Mach-O 64-bit (arm64 executable|executable arm64)'
          # Apple Silicon kills unsigned binaries; the linker's ad-hoc
          # signature must survive `strip = true`.
          codesign --verify --verbose "$bin"
          # Without OpenDeck's arguments it stops at the first missing flag,
          # which proves it got as far as main().
          out=$("$bin" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "missing CLI flag: -port"
      - run: node build.mjs aarch64-apple-darwin

  # The same MSRV check on macOS, as its own job: the master ruleset requires
  # a check named exactly `msrv`, which a matrix would rename.
  msrv-macos:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-01)
        with:
          toolchain: "1.88" # Cargo.toml rust-version
      - run: cargo check --all-targets --locked

  bundle:
    # Builds and packages both shipped architectures, so a broken aarch64
    # build shows up here rather than in a release.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (2026-10-01)
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - name: Install cross-compilation linker (aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - run: cargo build --release --locked --target aarch64-unknown-linux-gnu
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node build.mjs x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
